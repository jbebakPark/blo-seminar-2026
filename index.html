<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            /* 부드러운 스크롤 */
            scroll-behavior: smooth;
            /* iOS에서 탭 하이라이트 제거 */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
            color: #333;

            -webkit-overflow-scrolling: touch;
            /* 텍스트 크기 자동 조정 방지 */
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);

        /* 상단 네비게이션 */
        .top-nav {
            background: #0066b3;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
            /* 터치 영역 확대 */
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* 터치 피드백 */
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0.3);
        }

        .nav-link:hover,
        .nav-link:active {
            background: white;
            color: #0066b3;
        }

        .top-logo {
            background: white;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #0066b3;
        }

        .samsung-logo {
            font-size: 36px;
            font-weight: bold;

        .blo-badge {
            background: linear-gradient(135deg, #1e3799 0%, #0c2461 100%);

            padding: 15px 35px;

            margin-top: 20px;

        /* 실시간 카운터 */
        .counter-section {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);

        .counter-title {

            color: #000;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .counter-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.1);
            padding: 20px 30px;
            border-radius: 15px;
            min-width: 150px;
        }

        .counter-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        .counter-value {

            font-weight: bold;
            color: #000;

        .counter-value.updating {

<body>
    <div id="loading" class="loading">세미나 정보를 불러오는 중...</div>
    <div id="seminarContent" style="display: none;"></div>

    <script>
        // Firebase 설정 (실제 사용시 본인의 설정으로 교체)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화 (설정이 없으면 로컬 데이터 사용)
        let db = null;
        let useFirebase = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                useFirebase = true;
                console.log('Firebase 연동 성공');
            }
        } catch (error) {
            console.log('Firebase 미연동 - 로컬 데이터 사용');
        }

        // 현재 표시할 데이터 파일 (Firebase 미사용시)
        // const CURRENT_DATA_FILE = 'data-2026-02.json';
        const CURRENT_DATA_FILE = 'data/seminars/data-2026-02.json';
        const CURRENT_SEMINAR_ID = '2026-02';

        let counterUnsubscribe = null;

        async function loadSeminarData() {
            try {
                let data;

                if (useFirebase) {
                    // Firebase에서 데이터 로드
                    const doc = await db.collection('seminars').doc(CURRENT_SEMINAR_ID).get();
                    if (doc.exists) {
                        data = doc.data();
                    } else {

                    }
                } else {

                    data = await response.json();
                }

                initializeCounter(CURRENT_SEMINAR_ID);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('seminarContent').style.display = 'block';
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('loading').innerHTML =
                    '데이터를 불러오는데 실패했습니다.<br><br>' +

                        if (doc.exists) {
                            const data = doc.data();
                            updateCounterDisplay(data.offline || 0, data.online || 0, data.total || 0);
                        }
                    });
            } else {
                // 로컬 스토리지 사용
                loadLocalCounter(seminarId);
                // 데모: 랜덤 증가 시뮬레이션
                simulateCounter(seminarId);
            }
        }

        function loadLocalCounter(seminarId) {

        function simulateCounter(seminarId) {
            setInterval(() => {
                if (Math.random() > 0.6) {
                    const offlineEl = document.getElementById('offlineCount');
                    const onlineEl = document.getElementById('onlineCount');
                    const totalEl = document.getElementById('totalCount');

                    if (offlineEl && onlineEl && totalEl) {
                        let offline = parseInt(offlineEl.textContent);
                        let online = parseInt(onlineEl.textContent);

                        // 랜덤으로 온라인/오프라인 증가
                        if (Math.random() > 0.7) {
                            offline += 1;
                        } else {
                            online += Math.floor(Math.random() * 2) + 1;
                        }

                        const total = offline + online;

                        animateCounterChange(offlineEl, offline);
                        animateCounterChange(onlineEl, online);
                        animateCounterChange(totalEl, total);

                        // 로컬 스토리지 저장
                        localStorage.setItem(`counter_${seminarId}`, JSON.stringify({
                            offline, online, total
                        }));
                    }
                }
            }, Math.random() * 20000 + 10000);  // 10-30초마다
        }

        function updateCounterDisplay(offline, online, total) {
            const offlineEl = document.getElementById('offlineCount');
            const onlineEl = document.getElementById('onlineCount');
            const totalEl = document.getElementById('totalCount');

            if (offlineEl) animateCounterChange(offlineEl, offline);
            if (onlineEl) animateCounterChange(onlineEl, online);
            if (totalEl) animateCounterChange(totalEl, total);
        }

            textArea.value = code;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.select();

                document.execCommand('copy');
