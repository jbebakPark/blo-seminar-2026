<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2030 Business Live ON - 세미나 안내</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        /* 상단 네비게이션 */
        .top-nav {
            background: #0066b3;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-link:hover {
            background: white;
            color: #0066b3;
        }

        .top-logo {
            background: white;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #0066b3;
        }

        .samsung-logo {
            font-size: 36px;
            font-weight: bold;
            color: #0066b3;
            margin-bottom: 5px;
        }

        .blo-badge {
            background: linear-gradient(135deg, #1e3799 0%, #0c2461 100%);
            color: white;
            padding: 15px 35px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        /* 실시간 카운터 */
        .counter-section {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            padding: 30px;
            text-align: center;
            box-shadow: inset 0 -5px 10px rgba(0, 0, 0, 0.1);
        }

        .counter-title {
            font-size: 18px;
            color: #000;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .counter-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.1);
            padding: 20px 30px;
            border-radius: 15px;
            min-width: 150px;
        }

        .counter-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        .counter-value {
            font-size: 48px;
            font-weight: bold;
            color: #000;
            font-family: 'Arial', sans-serif;
            transition: all 0.3s;
        }

        .counter-value.updating {
            transform: scale(1.2);
            color: #FF6B6B;
        }

        .header {
            background: linear-gradient(135deg, #000000 0%, #16213e 50%, #0f3460 100%);
            padding: 60px 40px;
            text-align: center;
            position: relative;
        }

        .date-badge {
            background: rgba(255, 255, 255, 0.15);
            color: #FFD700;
            padding: 12px 30px;
            border-radius: 25px;
            display: inline-block;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        .main-title {
            font-size: 40px;
            color: white;
            font-weight: bold;
            margin: 25px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            line-height: 1.4;
        }

        .subtitle {
            font-size: 18px;
            color: #a8d8ea;
            margin-top: 20px;
            line-height: 1.6;
        }

        .content {
            padding: 50px 40px;
        }

        .section {
            margin-bottom: 45px;
        }

        .section-title {
            font-size: 26px;
            color: #0f3460;
            font-weight: bold;
            margin-bottom: 25px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #e8f4fd 0%, #d4e7f7 100%);
            border-radius: 10px;
            border-left: 5px solid #0066b3;
        }

        .info-box {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8f4fd 100%);
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 6px solid #0066b3;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .info-row {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .info-label {
            font-weight: bold;
            color: #0f3460;
            min-width: 140px;
            font-size: 19px;
        }

        .info-value {
            color: #333;
            font-size: 18px;
            line-height: 1.7;
        }

        .highlight {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            color: #0f3460;
        }

        .speaker-section {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            padding: 40px;
            border-radius: 15px;
            margin-top: 30px;
            color: white;
        }

        .speaker-name {
            font-size: 36px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 15px;
            text-align: center;
        }

        .speaker-role {
            font-size: 20px;
            color: #a8d8ea;
            margin-bottom: 10px;
            text-align: center;
        }

        .speaker-credentials {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .credential-item {
            padding: 10px 0;
            font-size: 17px;
            line-height: 1.6;
        }

        .credential-item::before {
            content: '⭐';
            margin-right: 10px;
        }

        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .benefit-card {
            background: white;
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }

        .benefit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(15, 52, 96, 0.15);
            border-color: #0066b3;
        }

        .benefit-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .benefit-title {
            font-size: 18px;
            font-weight: bold;
            color: #0f3460;
            margin-bottom: 10px;
        }

        .benefit-desc {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
        }

        .contact-box {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .online-button,
        .offline-button,
        .kakao-button {
            display: block;
            padding: 20px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            text-align: center;
        }

        .online-button {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            color: white;
            border: 3px solid #FF4757;
        }

        .online-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
        }

        .offline-button {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            border: 3px solid #357ABD;
        }

        .kakao-button {
            background: linear-gradient(135deg, #FEE500 0%, #FFEB3B 100%);
            color: #3c1e1e;
            border: 3px solid #FDD835;
        }

        .footer {
            background: linear-gradient(135deg, #e8f4fd 0%, #d4e7f7 100%);
            padding: 40px;
            text-align: center;
            font-size: 18px;
            color: #0f3460;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            color: white;
            font-size: 20px;
        }

        @media (max-width: 768px) {

            .benefits-grid,
            .counter-display {
                grid-template-columns: 1fr;
            }

            .main-title {
                font-size: 32px;
            }

            .content {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading">세미나 정보를 불러오는 중...</div>
    <div id="seminarContent" style="display: none;"></div>

    <script>
        // Firebase 설정 (실제 사용시 본인의 설정으로 교체)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화 (설정이 없으면 로컬 데이터 사용)
        let db = null;
        let useFirebase = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                useFirebase = true;
                console.log('Firebase 연동 성공');
            }
        } catch (error) {
            console.log('Firebase 미연동 - 로컬 데이터 사용');
        }

        // 현재 표시할 데이터 파일 (Firebase 미사용시)
        // const CURRENT_DATA_FILE = 'data-2026-02.json';
        const CURRENT_DATA_FILE = 'data/seminars/data-2026-02.json';
        const CURRENT_SEMINAR_ID = '2026-02';

        let counterUnsubscribe = null;

        async function loadSeminarData() {
            try {
                let data;

                if (useFirebase) {
                    // Firebase에서 데이터 로드
                    const doc = await db.collection('seminars').doc(CURRENT_SEMINAR_ID).get();
                    if (doc.exists) {
                        data = doc.data();
                    } else {
                        throw new Error('세미나 데이터를 찾을 수 없습니다.');
                    }
                } else {
                    // 로컬 JSON 파일에서 로드
                    const response = await fetch(CURRENT_DATA_FILE);
                    data = await response.json();
                }

                renderSeminar(data);
                initializeCounter(CURRENT_SEMINAR_ID);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('seminarContent').style.display = 'block';
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('loading').innerHTML =
                    '데이터를 불러오는데 실패했습니다.<br><br>' +
                    '로컬 테스트 모드: data-2026-02.json 파일이 필요합니다.';
            }
        }

        function initializeCounter(seminarId) {
            if (useFirebase) {
                // Firebase 실시간 리스너
                counterUnsubscribe = db.collection('counters').doc(seminarId)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            updateCounterDisplay(data.offline || 0, data.online || 0, data.total || 0);
                        }
                    });
            } else {
                // 로컬 스토리지 사용
                loadLocalCounter(seminarId);
                // 데모: 랜덤 증가 시뮬레이션
                simulateCounter(seminarId);
            }
        }

        function loadLocalCounter(seminarId) {
            const saved = localStorage.getItem(`counter_${seminarId}`);
            if (saved) {
                const data = JSON.parse(saved);
                updateCounterDisplay(data.offline, data.online, data.total);
            } else {
                // 초기값
                updateCounterDisplay(45, 128, 173);
            }
        }

        function simulateCounter(seminarId) {
            setInterval(() => {
                if (Math.random() > 0.6) {
                    const offlineEl = document.getElementById('offlineCount');
                    const onlineEl = document.getElementById('onlineCount');
                    const totalEl = document.getElementById('totalCount');

                    if (offlineEl && onlineEl && totalEl) {
                        let offline = parseInt(offlineEl.textContent);
                        let online = parseInt(onlineEl.textContent);

                        // 랜덤으로 온라인/오프라인 증가
                        if (Math.random() > 0.7) {
                            offline += 1;
                        } else {
                            online += Math.floor(Math.random() * 2) + 1;
                        }

                        const total = offline + online;

                        animateCounterChange(offlineEl, offline);
                        animateCounterChange(onlineEl, online);
                        animateCounterChange(totalEl, total);

                        // 로컬 스토리지 저장
                        localStorage.setItem(`counter_${seminarId}`, JSON.stringify({
                            offline, online, total
                        }));
                    }
                }
            }, Math.random() * 20000 + 10000);  // 10-30초마다
        }

        function updateCounterDisplay(offline, online, total) {
            const offlineEl = document.getElementById('offlineCount');
            const onlineEl = document.getElementById('onlineCount');
            const totalEl = document.getElementById('totalCount');

            if (offlineEl) animateCounterChange(offlineEl, offline);
            if (onlineEl) animateCounterChange(onlineEl, online);
            if (totalEl) animateCounterChange(totalEl, total);
        }

        function animateCounterChange(element, newValue) {
            element.classList.add('updating');

            setTimeout(() => {
                element.textContent = newValue;
                element.classList.remove('updating');
            }, 300);
        }

        function renderSeminar(data) {
            const seminar = data.seminar;
            const registration = data.registration;
            const contact = data.contact;

            const content = document.getElementById('seminarContent');
            content.innerHTML = `
                <div class="container">
                    <div class="top-nav">
                        <a href="pages/schedule.html" class="nav-link">📅 연간 일정</a>
                        <a href="pages/archive.html" class="nav-link">📚 지난 세미나</a>
                        <a href="pages/admin.html" class="nav-link">⚙️ 관리자</a>
                    </div>
                    
                    <div class="top-logo">
                        <div class="samsung-logo">SAMSUNG</div>
                        <div style="font-size: 16px; color: #0066b3;">삼성생명</div>
                        <div class="blo-badge">2030 BUSINESS LIVE ON</div>
                    </div>
                    
                    <div class="counter-section">
                        <div class="counter-title">🎉 실시간 신청 현황</div>
                        <div class="counter-display">
                            <div class="counter-box">
                                <div class="counter-label">오프라인</div>
                                <div class="counter-value" id="offlineCount">0</div>
                            </div>
                            <div class="counter-box">
                                <div class="counter-label">온라인</div>
                                <div class="counter-value" id="onlineCount">0</div>
                            </div>
                            <div class="counter-box" style="background: rgba(0,0,0,0.2);">
                                <div class="counter-label">총 신청자</div>
                                <div class="counter-value" id="totalCount">0</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="header">
                        <div class="date-badge">${data.monthName} ${data.date.split('-')[0]}</div>
                        <h1 class="main-title">${seminar.title}</h1>
                        <p class="subtitle">${seminar.subtitle || ''}</p>
                    </div>
                    
                    <div class="content">
                        <div class="section">
                            <div class="section-title">🎯 세미나 개요</div>
                            <div class="info-box">
                                <div class="info-row">
                                    <div class="info-label">일시</div>
                                    <div class="info-value">
                                        <span class="highlight">${seminar.date} ${seminar.time}</span>
                                    </div>
                                </div>
                                <div class="info-row">
                                    <div class="info-label">주제</div>
                                    <div class="info-value">
                                        <strong style="font-size: 20px; color: #0f3460;">${seminar.title}</strong>
                                    </div>
                                </div>
                                <div class="info-row">
                                    <div class="info-label">강사</div>
                                    <div class="info-value">${seminar.speaker.name} (${seminar.speaker.title})</div>
                                </div>
                            </div>
                            
                            ${seminar.description ? `
                            <div style="background: linear-gradient(135deg, #f8f9ff 0%, #e8f4fd 100%); padding: 30px; border-radius: 12px;">
                                <p style="font-size: 18px; line-height: 1.9; color: #333;">${seminar.description}</p>
                            </div>` : ''}
                        </div>
                        
                        <div class="section">
                            <div class="section-title">🎤 강사 소개</div>
                            <div class="speaker-section">
                                <div class="speaker-name">${seminar.speaker.name}</div>
                                <div class="speaker-role">${seminar.speaker.title}</div>
                                
                                <div class="speaker-credentials">
                                    ${seminar.speaker.credentials.map(cred => `
                                        <div class="credential-item">${cred}</div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">📝 신청 방법</div>
                            <div class="info-box">
                                <div style="margin-bottom: 30px;">
                                    <h3 style="color: #0f3460; font-size: 22px; margin-bottom: 15px;">🍽️ ${registration.offline.title}</h3>
                                    <div class="info-row">
                                        <div class="info-label">신청 기간</div>
                                        <div class="info-value"><span class="highlight">${registration.offline.deadline}</span></div>
                                    </div>
                                    <div class="info-row">
                                        <div class="info-label">신청 방법</div>
                                        <div class="info-value">${registration.offline.method}</div>
                                    </div>
                                </div>
                                
                                <div style="border-top: 2px solid #e0e7ff; padding-top: 30px;">
                                    <h3 style="color: #0f3460; font-size: 22px; margin-bottom: 15px;">💻 ${registration.online.title}</h3>
                                    <div class="info-row">
                                        <div class="info-label">신청 기간</div>
                                        <div class="info-value"><span class="highlight">${registration.online.startDate}</span></div>
                                    </div>
                                    <div class="info-row">
                                        <div class="info-label">웹사이트</div>
                                        <div class="info-value"><strong>${registration.online.website}</strong></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">🎁 참여 혜택</div>
                            <div class="benefits-grid">
                                ${data.benefits.map(benefit => `
                                    <div class="benefit-card">
                                        <div class="benefit-icon">${benefit.icon}</div>
                                        <div class="benefit-title">${benefit.title}</div>
                                        <div class="benefit-desc">${benefit.description}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">📞 세미나 신청 및 문의</div>
                            <div class="contact-box">
                                <div class="button-group">
                                    <a href="http://${contact.website}" class="online-button" target="_blank">
                                        🎥 온라인 실시간 생방송 신청하기
                                    </a>
                                    <a href="tel:${contact.phone.replace(/-/g, '')}" class="offline-button">
                                        🍽️ 오프라인 조찬세미나 신청
                                    </a>
                                    <a href="${contact.kakao}" class="kakao-button" target="_blank">
                                        💬 카카오톡 문의하기
                                    </a>
                                </div>
                                
                                <div style="margin-top: 30px; padding-top: 30px; border-top: 2px solid rgba(255,255,255,0.2);">
                                    <div style="font-size: 24px; font-weight: bold; color: #FFD700;">${contact.name}</div>
                                    <div style="font-size: 28px; font-weight: bold; color: white; margin-top: 10px;">
                                        📱 ${contact.phone}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="footer">
                        <p><strong>2030 Business Live ON</strong></p>
                        <p style="margin-top: 12px;">대한민국 최고 석학들과 함께하는 프리미엄 경영 세미나</p>
                        <p style="margin-top: 25px; color: #666;">주체: ${data.organizer}</p>
                    </div>
                </div>
            `;
        }

        // 페이지 로드 시 실행
        loadSeminarData();

        // 페이지 언로드 시 리스너 정리
        window.addEventListener('beforeunload', () => {
            if (counterUnsubscribe) {
                counterUnsubscribe();
            }
        });
    </script>
</body>

</html>
