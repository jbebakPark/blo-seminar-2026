name: 🚀 Firebase 자동 배포

on:
  push:
    branches:
      - main
  workflow_dispatch: # 수동 실행 가능

jobs:
  deploy:
    name: Firebase Hosting 배포
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🔧 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: 🐍 Python 설정 (Functions 의존성 없음, hosting용)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Functions 의존성 설치
        run: cd functions && npm install

      - name: ✅ 배포 전 검증
        run: |
          echo "🔍 프로젝트 구조 확인..."
          ls -la
          echo "📄 Firebase 설정 확인..."
          cat firebase.json
          echo "🌐 배포할 파일 목록..."
          ls -la *.html

      - name: 🚀 Firebase Hosting 배포
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADMIN_SAMSUNG_VVIP }}
        run: |
          echo "🔥 Firebase에 배포 중..."
          # GitHub Secrets에 저장한 서비스 계정 JSON을 파일로 생성
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          # 프로젝트 명시 (admin-samsung-vvip)로 배포
          firebase deploy --only hosting,functions --project admin-samsung-vvip --non-interactive
          echo "✅ 배포 완료!"

      - name: 📊 배포 결과 요약
        if: success()
        run: |
          echo "=========================================="
          echo "✅ 배포 성공!"
          echo "=========================================="
          echo "🌐 사이트 URL: https://admin-samsung-vvip.web.app"
          echo "📊 콘솔: https://console.firebase.google.com/project/admin-samsung-vvip"
          echo "⏰ 배포 시간: $(date)"
          echo "=========================================="

      - name: ❌ 배포 실패 알림
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ 배포 실패"
          echo "=========================================="
          echo "로그를 확인하여 문제를 해결해주세요."
          echo "수동 배포: https://console.firebase.google.com"
          echo "=========================================="
