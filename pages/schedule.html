<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 연간 일정 - 2030 Business Live ON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: #f0f4fa;
            padding: 20px;
            color: #1a2a3a;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: #0D2244;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 13px;
            font-weight: bold;
            color: #C8A84B;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .year-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #fff;
        }

        .theme {
            font-size: 18px;
            color: #C8A84B;
            margin-bottom: 10px;
        }

        .description {
            font-size: 14px;
            color: #a8bcd4;
            line-height: 1.8;
            max-width: 700px;
            margin: 0 auto;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 22px;
            background: #fff;
            border: 1.5px solid #1050A0;
            border-radius: 8px;
            color: #1050A0;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #1050A0;
            color: #fff;
        }

        .quarters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .quarter-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1.5px solid #D8E4F0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: all 0.2s;
        }

        .quarter-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(16,80,160,0.12);
            border-color: #1050A0;
        }

        .quarter-number {
            font-size: 36px;
            font-weight: bold;
            color: #1050A0;
            margin-bottom: 6px;
        }

        .quarter-title {
            font-size: 15px;
            color: #445566;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #E8EEF6;
        }

        .session {
            margin-bottom: 14px;
            padding: 13px;
            background: #f7f9fc;
            border-radius: 8px;
            border-left: 4px solid #ccc;
            transition: all 0.2s;
        }

        .session.completed {
            border-left-color: #22A06B;
            background: #f0faf5;
        }

        .session.current {
            border-left: none;
            background: linear-gradient(135deg, #0D2244 0%, #1050A0 100%);
            box-shadow: 0 6px 24px rgba(16,80,160,0.35);
            border-radius: 10px;
            padding: 16px 16px 14px;
            position: relative;
            overflow: hidden;
        }
        .session.current::before {
            content: '▶ 이번 달 세미나';
            position: absolute;
            top: 0; right: 0;
            background: #C8A84B;
            color: #0D1A2E;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 0 10px 0 8px;
            letter-spacing: 0.5px;
        }
        .session.current .session-date {
            color: #C8A84B;
            font-size: 14px;
        }
        .session.current .session-title {
            color: #fff;
            font-size: 15px;
            font-weight: 800;
        }
        .session.current .session-type {
            background: rgba(255,255,255,0.15);
            color: #d0e4ff;
        }
        .session.current .session-speakers {
            color: #a8c4e4;
        }
        .session.current .status-current {
            background: #C8A84B;
            color: #0D1A2E;
            font-weight: 900;
        }

        .session.upcoming {
            border-left-color: #1050A0;
            background: #f0f4ff;
        }

        .session:hover {
            transform: translateX(4px);
        }

        .session-date {
            font-size: 13px;
            color: #1050A0;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .session-type {
            display: inline-block;
            padding: 2px 8px;
            background: #E8EEF6;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
            color: #445566;
        }

        .session-title {
            font-size: 14px;
            color: #0D1A2E;
            margin: 6px 0;
            font-weight: 600;
            line-height: 1.4;
        }

        .session-speakers {
            font-size: 12px;
            color: #667788;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 6px;
        }

        .status-completed {
            background: #DCFCE7;
            color: #166534;
        }

        .status-current {
            background: #FEF9C3;
            color: #854D0E;
            animation: pulse 2s infinite;
        }

        .status-upcoming {
            background: #DBEAFE;
            color: #1e40af;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 14px 20px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #D8E4F0;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #334455;
        }

        .legend-color {
            width: 24px;
            height: 4px;
            border-radius: 2px;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #778899;
            font-size: 13px;
        }

        /* 신청 대상 안내 섹션 */
        .target-audience-section {
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%);
            padding: 25px 30px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #ff9800;
        }

        .target-audience-title {
            font-size: 16px;
            color: #e65100;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .target-audience-text {
            font-size: 18px;
            color: #0f3460;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .inquiry-button {
            display: inline-block;
            background: linear-gradient(135deg, #FEE500 0%, #FFEB3B 100%);
            color: #3c1e1e;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            border: 2px solid #FDD835;
            cursor: pointer;
        }

        .inquiry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(254, 229, 0, 0.4);
            background: linear-gradient(135deg, #FFEB3B 0%, #FDD835 100%);
        }

        @media (max-width: 768px) {
            .quarters-grid { grid-template-columns: 1fr; }
            .year-title { font-size: 28px; }
            .theme { font-size: 16px; }
            .target-audience-section { padding: 18px 14px; }
            .target-audience-title { font-size: 13px; }
            .target-audience-text { font-size: 15px; }
            .inquiry-button { font-size: 14px; padding: 10px 22px; }
            .legend { gap: 14px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">2030 BUSINESS LIVE ON</div>
            <h1 class="year-title" id="yearTitle">2026 연간 일정</h1>
            <p class="theme" id="theme"></p>
            <p class="description" id="description"></p>
        </div>

        <div class="target-audience-section">
            <div class="target-audience-title">📢 세미나 신청 대상 안내</div>
            <div class="target-audience-text">CEO(회장) 및 임원, 자산가</div>
            <a href="https://open.kakao.com/o/sleUSUei" class="inquiry-button" target="_blank">
                💬 세미나 참석 문의
            </a>
        </div>

        <div class="nav-buttons">
            <a href="../index.html" class="nav-btn">🏠 메인으로</a>
            <a href="archive.html" class="nav-btn">📚 지난 세미나</a>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #4CAF50;"></div>
                <span>완료</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFD700;"></div>
                <span>진행중</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #2196F3;"></div>
                <span>예정</span>
            </div>
        </div>

        <div id="quartersGrid" class="quarters-grid"></div>

        <div class="footer">
            <p>주최: 삼성생명 WM 사업부</p>
            <p style="margin-top: 10px;">문의: 박재박 팀장 010-5137-2327</p>
        </div>
    </div>

    <script>
        async function loadSchedule() {
            try {
                const response = await fetch('../data/schedule-2026.json');
                const data = await response.json();
                renderSchedule(data);
            } catch (error) {
                console.error('일정 로드 실패:', error);
                document.getElementById('quartersGrid').innerHTML =
                    '<p style="text-align: center; color: #999;">일정을 불러오는데 실패했습니다.</p>';
            }
        }

        function renderSchedule(data) {
            document.getElementById('yearTitle').textContent = `${data.year} 연간 일정`;
            document.getElementById('theme').textContent = data.theme;
            document.getElementById('description').textContent = data.description;

            const grid = document.getElementById('quartersGrid');
            grid.innerHTML = '';

            data.quarters.forEach(quarter => {
                const card = document.createElement('div');
                card.className = 'quarter-card';

                const sessionsHTML = quarter.sessions.map(session => {
                    const date = new Date(session.date);
                    const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;

                    const statusClass = `status-${session.status}`;
                    const statusText = {
                        'completed': '완료',
                        'current': '진행중',
                        'upcoming': '예정'
                    }[session.status];

                    return `
                        <div class="session ${session.status}">
                            <div class="session-date">${dateStr}</div>
                            <div>
                                <span class="session-type">[${session.type}]</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="session-title">${session.title}</div>
                            <div class="session-speakers">강사: ${session.speakers.join(', ')}</div>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="quarter-number">${quarter.quarter}분기</div>
                    <div class="quarter-title">${quarter.title}</div>
                    ${sessionsHTML}
                `;

                grid.appendChild(card);
            });
        }

        // 페이지 로드 시 실행
        loadSchedule();
    </script>
</body>

</html>
