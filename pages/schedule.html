<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 연간 일정 - 2030 Business Live ON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2f4a 100%);
            padding: 20px;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 20px;
        }

        .year-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme {
            font-size: 24px;
            color: #a8d8ea;
            margin-bottom: 15px;
        }

        .description {
            font-size: 16px;
            color: #ccc;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .nav-btn {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #FFD700;
            border-radius: 10px;
            color: #FFD700;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #FFD700;
            color: #000;
            transform: translateY(-3px);
        }

        .quarters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .quarter-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s;
        }

        .quarter-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
        }

        .quarter-number {
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .quarter-title {
            font-size: 18px;
            color: #a8d8ea;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .session {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border-left: 4px solid #666;
            transition: all 0.3s;
        }

        .session.completed {
            border-left-color: #4CAF50;
            opacity: 0.7;
        }

        .session.current {
            border-left-color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .session.upcoming {
            border-left-color: #2196F3;
        }

        .session:hover {
            transform: translateX(5px);
        }

        .session-date {
            font-size: 14px;
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .session-type {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 12px;
            margin-right: 8px;
            color: #a8d8ea;
        }

        .session-title {
            font-size: 15px;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .session-speakers {
            font-size: 13px;
            color: #999;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
        }

        .status-completed {
            background: #4CAF50;
            color: white;
        }

        .status-current {
            background: #FFD700;
            color: #000;
            animation: pulse 2s infinite;
        }

        .status-upcoming {
            background: #2196F3;
            color: white;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 40px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 4px;
            border-radius: 2px;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .quarters-grid {
                grid-template-columns: 1fr;
            }

            .year-title {
                font-size: 36px;
            }

            .theme {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">2030 BUSINESS LIVE ON</div>
            <h1 class="year-title" id="yearTitle">2026 연간 일정</h1>
            <p class="theme" id="theme"></p>
            <p class="description" id="description"></p>
        </div>

        <div class="nav-buttons">
            <a href="../index.html" class="nav-btn">🏠 메인으로</a>
            <a href="archive.html" class="nav-btn">📚 지난 세미나</a>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #4CAF50;"></div>
                <span>완료</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFD700;"></div>
                <span>진행중</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #2196F3;"></div>
                <span>예정</span>
            </div>
        </div>

        <div id="quartersGrid" class="quarters-grid"></div>

        <div class="footer">
            <p>주체: 삼성생명 WM 사업부</p>
            <p style="margin-top: 10px;">문의: 박재박 팀장 010-5137-2327</p>
        </div>
    </div>

    <script>
        async function loadSchedule() {
            try {
                const response = await fetch('../data/schedule-2026.json');
                const data = await response.json();
                renderSchedule(data);
            } catch (error) {
                console.error('일정 로드 실패:', error);
                document.getElementById('quartersGrid').innerHTML =
                    '<p style="text-align: center; color: #999;">일정을 불러오는데 실패했습니다.</p>';
            }
        }

        function renderSchedule(data) {
            document.getElementById('yearTitle').textContent = `${data.year} 연간 일정`;
            document.getElementById('theme').textContent = data.theme;
            document.getElementById('description').textContent = data.description;

            const grid = document.getElementById('quartersGrid');
            grid.innerHTML = '';

            data.quarters.forEach(quarter => {
                const card = document.createElement('div');
                card.className = 'quarter-card';

                const sessionsHTML = quarter.sessions.map(session => {
                    const date = new Date(session.date);
                    const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;

                    const statusClass = `status-${session.status}`;
                    const statusText = {
                        'completed': '완료',
                        'current': '진행중',
                        'upcoming': '예정'
                    }[session.status];

                    return `
                        <div class="session ${session.status}">
                            <div class="session-date">${dateStr}</div>
                            <div>
                                <span class="session-type">[${session.type}]</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="session-title">${session.title}</div>
                            <div class="session-speakers">강사: ${session.speakers.join(', ')}</div>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="quarter-number">${quarter.quarter}분기</div>
                    <div class="quarter-title">${quarter.title}</div>
                    ${sessionsHTML}
                `;

                grid.appendChild(card);
            });
        }

        // 페이지 로드 시 실행
        loadSchedule();
    </script>
</body>

</html>
