<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세미나 아카이브 - 2030 Business Live ON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2f4a 100%);
            padding: 20px;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 18px;
            color: #a8d8ea;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #FFD700;
            border-radius: 10px;
            color: #FFD700;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #FFD700;
            color: #000;
            transform: translateY(-3px);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            color: #a8d8ea;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #FFD700;
            color: #000;
            border-color: #FFD700;
        }

        .seminars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .seminar-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .seminar-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
        }

        .seminar-header {
            padding: 25px;
            background: linear-gradient(135deg, rgba(15, 52, 96, 0.5), rgba(22, 33, 62, 0.5));
        }

        .seminar-date {
            font-size: 14px;
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .seminar-title {
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .seminar-speaker {
            font-size: 16px;
            color: #a8d8ea;
        }

        .seminar-body {
            padding: 25px;
        }

        .seminar-description {
            font-size: 14px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .seminar-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 5px 12px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            font-size: 12px;
            color: #FFD700;
        }

        .seminar-footer {
            padding: 15px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .view-count {
            font-size: 13px;
            color: #999;
        }

        .detail-btn {
            padding: 8px 20px;
            background: #FFD700;
            color: #000;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .detail-btn:hover {
            background: #FFA500;
            transform: scale(1.05);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            color: #FFD700;
            font-size: 20px;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 800px;
            margin: 50px auto;
            background: linear-gradient(135deg, #1a2f4a, #0a1628);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            border: 2px solid #FFD700;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: #FFD700;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.1);
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #FFD700;
            color: #000;
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .seminars-grid {
                grid-template-columns: 1fr;
            }

            .page-title {
                font-size: 36px;
            }

            .modal-content {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">2030 BUSINESS LIVE ON</div>
            <h1 class="page-title">📚 세미나 아카이브</h1>
            <p class="subtitle">지난 세미나 다시보기</p>
        </div>

        <div class="nav-buttons">
            <a href="../index.html" class="nav-btn">🏠 메인으로</a>
            <a href="schedule.html" class="nav-btn">📅 연간 일정</a>
            <a href="admin.html" class="nav-btn">⚙️ 관리자</a>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="2026">2026년</button>
            <button class="filter-btn" data-filter="forum">Forum</button>
            <button class="filter-btn" data-filter="class">Class</button>
        </div>

        <div id="loading" class="loading">세미나 목록을 불러오는 중...</div>
        <div id="seminarsGrid" class="seminars-grid" style="display: none;"></div>
        <div id="noResults" class="no-results" style="display: none;">
            검색 결과가 없습니다.
        </div>

        <div class="footer">
            <p>주체: 삼성생명 WM 사업부</p>
            <p style="margin-top: 10px;">문의: 박재박 팀장 010-5137-2327</p>
        </div>
    </div>

    <!-- 상세보기 모달 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let seminars = [];
        let currentFilter = 'all';

        // 샘플 데이터 (실제로는 Firebase나 JSON 파일에서 로드)
        const sampleSeminars = [
            {
                id: '2026-01',
                date: '2026-01-13',
                type: 'Forum',
                title: 'AI시대, 인간의 판단력은 어디로?',
                speakers: ['송길영 작가', '이동우 교수'],
                description: '인공지능이 쏟아내는 정보의 파도 속에서 우리의 판단력은 어떻게 변화하고 있을까요? 맥락을 읽는 직관과 가치를 판단하는 능력의 중요성을 탐구합니다.',
                tags: ['AI', '인간', '판단력', '미래사회'],
                views: 342,
                year: '2026'
            },
            {
                id: '2026-02',
                date: '2026-02-24',
                type: 'Class',
                title: '인류의 새로운 도전, 우주 탐사와 그 너머',
                speakers: ['강성주 박사'],
                description: '민간 기업과 기술 혁신이 결합되어 새로운 산업과 기회의 무대로 재편되는 우주. 무한한 가능성이 담긴 우주탐사의 현재와 그 너머를 살펴봅니다.',
                tags: ['우주', '탐사', '혁신', '미래기술'],
                views: 428,
                year: '2026'
            }
        ];

        async function loadSeminars() {
            // TODO: Firebase에서 실제 데이터 로드
            // const data = await getAllSeminars();

            // 임시로 샘플 데이터 사용
            await new Promise(resolve => setTimeout(resolve, 500));
            seminars = sampleSeminars;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('seminarsGrid').style.display = 'grid';

            renderSeminars();
        }

        function renderSeminars() {
            const grid = document.getElementById('seminarsGrid');
            const filteredSeminars = filterSeminars();

            if (filteredSeminars.length === 0) {
                grid.style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            document.getElementById('noResults').style.display = 'none';

            grid.innerHTML = filteredSeminars.map(seminar => {
                const date = new Date(seminar.date);
                const dateStr = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;

                return `
                    <div class="seminar-card" onclick="showDetail('${seminar.id}')">
                        <div class="seminar-header">
                            <div class="seminar-date">${dateStr} [${seminar.type}]</div>
                            <div class="seminar-title">${seminar.title}</div>
                            <div class="seminar-speaker">강사: ${seminar.speakers.join(', ')}</div>
                        </div>
                        <div class="seminar-body">
                            <div class="seminar-description">${seminar.description}</div>
                            <div class="seminar-tags">
                                ${seminar.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                            </div>
                        </div>
                        <div class="seminar-footer">
                            <span class="view-count">👁️ ${seminar.views} views</span>
                            <button class="detail-btn" onclick="event.stopPropagation(); showDetail('${seminar.id}')">
                                자세히 보기
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterSeminars() {
            if (currentFilter === 'all') {
                return seminars;
            } else if (currentFilter === '2026') {
                return seminars.filter(s => s.year === '2026');
            } else {
                return seminars.filter(s => s.type.toLowerCase() === currentFilter.toLowerCase());
            }
        }

        function showDetail(seminarId) {
            const seminar = seminars.find(s => s.id === seminarId);
            if (!seminar) return;

            const date = new Date(seminar.date);
            const dateStr = `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div style="margin-bottom: 30px;">
                    <div style="font-size: 14px; color: #FFD700; margin-bottom: 10px;">
                        ${dateStr} [${seminar.type}]
                    </div>
                    <h2 style="font-size: 32px; color: #fff; margin-bottom: 20px; line-height: 1.4;">
                        ${seminar.title}
                    </h2>
                    <div style="font-size: 18px; color: #a8d8ea; margin-bottom: 20px;">
                        강사: ${seminar.speakers.join(', ')}
                    </div>
                    <div style="font-size: 16px; color: #ccc; line-height: 1.8; margin-bottom: 30px;">
                        ${seminar.description}
                    </div>
                    <div style="margin-bottom: 20px;">
                        ${seminar.tags.map(tag => `<span class="tag">#${tag}</span>`).join(' ')}
                    </div>
                </div>
                
                <div style="padding: 20px; background: rgba(255, 215, 0, 0.1); border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.3);">
                    <h3 style="color: #FFD700; margin-bottom: 15px; font-size: 20px;">📹 다시보기</h3>
                    <p style="color: #ccc; margin-bottom: 15px;">
                        이 세미나는 종료되었습니다. 다시보기는 회원 전용 서비스입니다.
                    </p>
                    <button onclick="alert('회원 전용 서비스입니다. 신청 페이지에서 회원 가입 후 이용하실 수 있습니다.')" 
                            style="padding: 12px 30px; background: #FFD700; color: #000; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 16px;">
                        다시보기 신청
                    </button>
                </div>
            `;

            document.getElementById('detailModal').style.display = 'block';
        }

        // 필터 버튼 이벤트
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderSeminars();
            });
        });

        // 모달 닫기
        document.querySelector('.modal-close').addEventListener('click', function () {
            document.getElementById('detailModal').style.display = 'none';
        });

        window.addEventListener('click', function (event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // 페이지 로드
        loadSeminars();
    </script>
</body>

</html>
